name: Assessment storage maintenance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, delete]
        default: audit
        required: true
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: workspace-production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure VPS SSH access
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${VPS_PORT:?Missing repository secret DEPLOY_PORT}"
          : "${VPS_USERNAME:?Missing repository secret DEPLOY_USER}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Audit or clean orphan assessment uploads
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          VPS_USERNAME: ${{ secrets.DEPLOY_USER }}
          CLEANUP_MODE: ${{ inputs.mode }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${SSHPASS:?Missing repository secret DEPLOY_PASSWORD}"
          if [ "$CLEANUP_MODE" = "delete" ]; then args="--delete"; else args=""; fi
          sshpass -e ssh -p "$VPS_PORT" -o BatchMode=no -o StrictHostKeyChecking=yes "$VPS_USERNAME@$VPS_HOST" "if [ \"\$(id -u)\" -eq 0 ]; then exec sudo -u workspace -H bash -lc 'cd /var/www/ft-workspace/backend && DJANGO_DB_PATH=/home/workspace/ft-workspace-data/workspace.sqlite3 ../.venv/bin/python manage.py cleanup_assessment_uploads $args'; else cd /var/www/ft-workspace/backend && DJANGO_DB_PATH=/home/workspace/ft-workspace-data/workspace.sqlite3 exec ../.venv/bin/python manage.py cleanup_assessment_uploads $args; fi"
